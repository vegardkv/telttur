<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turvann – Norwegian Camping Suitability Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15/dist/nouislider.min.css">
  <link rel="stylesheet" href="style.css">

  <!--
    Kick off the data.js download during HTML parse, in parallel with the libs
    below. data.js is NOT loaded with a plain <script> tag: at ~3.7 MB it would
    block the initial render until the whole payload arrived (~20 s on throttled
    mobile). Instead app.js injects it dynamically once the map shell is painted
    (see the bootstrap section in app.js). This preload hint means that by the
    time app.js injects the tag, the download is already in flight or cached.
  -->
  <link rel="preload" as="script" href="../output/data.js">
</head>
<body>
  <div id="map"></div>
  <!-- Shown until the lake data lands; populate() removes it. -->
  <div id="tt-loading"><div class="tt-spinner"></div></div>

  <!--
    All scripts are deferred so none of them block the initial render. data.js is
    intentionally absent here — app.js loads it after the basemap is up.
  -->
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script defer src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
  <script defer src="https://cdn.jsdelivr.net/npm/nouislider@15/dist/nouislider.min.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
