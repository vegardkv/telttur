[project]
name = "telttur"
version = "0.1.0"
description = "Generate interactive camping suitability maps for Norway"
readme = "README.md"
license = "MIT"
authors = [
    { name = "vegardkv", email = "vkvernelv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.2",
    "fiona>=1.10.1",
    "geopandas>=1.1.3",
    "pydantic>=2.12.5",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "requests>=2.33.1",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
]

[project.scripts]
telttur = "telttur.main:cli"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # literal expected values are the point of a test

[tool.ty.rules]
unresolved-attribute = "warn"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["str"]  # column-name/objtype string comparisons are not magic
