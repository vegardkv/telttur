# Telttur configuration - Full country (Norway) map
# Optimised for static hosting: marker clustering, no road rendering,
# only scoring dimensions that don't require full road processing.
fylke: norway

output_filename: map_norway.html

# Only include lakes ≥ 5 ha to keep the dataset manageable nationally
min_lake_area_m2: 50000

# Show only lakes worth camping at
min_lake_tenting_quality: Fair

lake_display_mode: marker
show_roads: false
landcover_mode: disabled

map:
  use_marker_cluster: true
  interactive_controls:
    enabled: false

scoring:
  enabled: true
  # Accessibility scoring requires road data for all of Norway — skip for performance
  accessibility:
    enabled: false
  # AR5 WFS is fetched per-request and impractical at national scale
  ar5_land_use:
    enabled: false
