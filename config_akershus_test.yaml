# Telttur configuration - First viable model (full Norway)
# National-scale static map with interactive scoring controls.
fylke: akershus

output_filename: data_akershus_test.js

# Only include lakes ≥ 5 ha to keep the dataset manageable nationally
min_lake_area_m2: 10000

lake_display_mode: marker
show_roads: false
landcover_mode: disabled

map:
  interactive_controls:
    enabled: true
