name: Generate Norway Map

on:
  workflow_dispatch:
    inputs:
      update_data:
        description: "Regenerate map data (slow). Uncheck for fast UI-only deploys that reuse the live data."
        type: boolean
        default: true

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ inputs.update_data }}
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ inputs.update_data }}
        uses: astral-sh/setup-uv@v6

      - name: Cache data
        if: ${{ inputs.update_data }}
        uses: actions/cache@v4
        with:
          path: data
          key: data-norway-${{ hashFiles('config_norway.yaml') }}
          restore-keys: data-norway-

      - name: Generate map
        if: ${{ inputs.update_data }}
        run: uv run telttur generate --config config_norway.yaml

      # The site is served as separate files (index.html + app.js + style.css + data.js)
      # so UI-only runs can reuse the data.js already on the live site.
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/style.css _site/
          # The frontend references ../output/data.js; flatten it to a sibling for the deploy.
          sed -i 's#\.\./output/data\.js#data.js#' _site/index.html
          if [ "${{ inputs.update_data }}" = "true" ]; then
            cp output/data_norway.js _site/data.js
          else
            echo "UI-only deploy: reusing data.js from the live site."
            curl -fsSL https://vegardkv.github.io/telttur/data.js -o _site/data.js
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
