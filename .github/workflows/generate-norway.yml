name: Generate Norway Map

on:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache data
        uses: actions/cache@v4
        with:
          path: data
          key: data-norway-${{ hashFiles('config_norway.yaml') }}
          restore-keys: data-norway-

      - name: Generate map
        run: uv run telttur generate --config config_norway.yaml

      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-norway
          path: output/map_norway.html

      # The embedded, self-contained HTML becomes the site's index page.
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp output/map_norway.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
