name: Generate Akershus Map

on:
  push:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Cache data
        uses: actions/cache@v4
        with:
          path: data
          key: data-akershus-${{ hashFiles('config_akershus.yaml') }}
          restore-keys: data-akershus-

      - name: Generate map
        run: uv run telttur generate --config config_akershus.yaml

      - name: Upload map artifact
        uses: actions/upload-artifact@v4
        with:
          name: map-akershus
          path: output/map_akershus.html
